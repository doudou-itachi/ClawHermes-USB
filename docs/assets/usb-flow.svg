<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">USB deployment flow</title>
  <desc id="desc">A colorful flow diagram for preparing a ClawHermes USB release package on a developer machine and handing it to a non-technical user.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 Z" fill="#5f6f85"/>
    </marker>
  </defs>
  <rect width="1100" height="420" rx="26" fill="#f7fbff"/>
  <text x="54" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">USB Deployment Flow</text>
  <text x="54" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#617086">Prepare on a fast developer machine, deliver a simple double-click experience.</text>
  <g filter="url(#shadow)">
    <rect x="54" y="140" width="210" height="170" rx="22" fill="#ffffff"/>
    <circle cx="100" cy="188" r="26" fill="#dbeafe"/>
    <path d="M88 197 h24 a6 6 0 0 0 6 -6 v-19 H82 v19 a6 6 0 0 0 6 6 z M90 172 v-13 M110 172 v-13" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">1. Build</text>
    <text x="82" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">npm install, npm run build</text>
    <text x="82" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">run tests on SSD</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="322" y="140" width="210" height="170" rx="22" fill="#ffffff"/>
    <circle cx="368" cy="188" r="26" fill="#dcfce7"/>
    <path d="M353 188 h30 M368 173 v30 M356 200 h24" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <text x="350" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">2. Prepare Payloads</text>
    <text x="350" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">apps, runtimes, WSL rootfs</text>
    <text x="350" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">no user-side installs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="140" width="210" height="170" rx="22" fill="#ffffff"/>
    <circle cx="636" cy="188" r="26" fill="#ffedd5"/>
    <path d="M624 196 h34 a6 6 0 0 0 6 -6 v-4 h-46 v4 a6 6 0 0 0 6 6 z M630 178 h22 l8 8 h-38 z" fill="none" stroke="#f97316" stroke-width="4" stroke-linejoin="round"/>
    <text x="618" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">3. Copy to USB</text>
    <text x="618" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">ship dist and payloads</text>
    <text x="618" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">exclude source-only files</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="858" y="140" width="188" height="170" rx="22" fill="#ffffff"/>
    <circle cx="904" cy="188" r="26" fill="#fce7f3"/>
    <path d="M895 178 h18 a8 8 0 0 1 8 8 v5 a8 8 0 0 1 -8 8 h-18 z M888 184 h8 v10 h-8 z" fill="none" stroke="#db2777" stroke-width="4" stroke-linejoin="round"/>
    <text x="886" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">4. Double Click</text>
    <text x="886" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">ClawHermes-Control.vbs</text>
    <text x="886" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">GUI guides the user</text>
  </g>
  <path d="M264 225 H322" stroke="#5f6f85" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M532 225 H590" stroke="#5f6f85" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 225 H858" stroke="#5f6f85" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="92" y="338" width="916" height="38" rx="19" fill="#e9f2ff"/>
  <text x="118" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#30445d">Rule: users should start, stop, configure models, and backup only. Dependency installation belongs on the developer machine.</text>
</svg>
