    <path d="M1025 106 h40 a8 8 0 0 1 8 8 v8 a8 8 0 0 1 -8 8 h-40 z" fill="#ffffff" opacity=".94"/>
    <rect x="1015" y="112" width="10" height="12" rx="3" fill="#ffffff" opacity=".94"/>
    <circle cx="1042" cy="118" r="5" fill="#2f7df6"/>
    <text x="1000" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">USB Portable</text>
  </g>
  <path d="M530 172 C570 150 590 126 618 118" fill="none" stroke="#9db8d8" stroke-width="3" stroke-dasharray="8 9"/>
  <path d="M530 190 C664 72 858 76 974 118" fill="none" stroke="#9db8d8" stroke-width="3" stroke-dasharray="8 9"/>
  <path d="M530 210 C596 232 606 246 610 250" fill="none" stroke="#9db8d8" stroke-width="3" stroke-dasharray="8 9"/>
  <path d="M830 250 H878" fill="none" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="842" y="222" width="50" height="22" rx="11" fill="#f6f9fc" stroke="#c9d6e6"/>
  <text x="854" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#53657a">API</text>
