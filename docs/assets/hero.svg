<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ClawHermes-USB portable runtime overview</title>
  <desc id="desc">A colorful overview showing a USB-first Windows portable runtime for OpenClaw, Hermes Agent, and Hermes Web UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7ff"/>
      <stop offset="55%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#f1fff8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7df6"/>
      <stop offset="100%" stop-color="#18b98f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#6b7b8e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#12304f" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 274 C154 224 248 330 388 278 C545 220 647 285 780 233 C935 172 1027 233 1200 172 L1200 360 L0 360 Z" fill="#dff5ee"/>
  <path d="M0 306 C190 262 290 346 446 304 C596 264 718 325 878 277 C1012 237 1080 278 1200 246 L1200 360 L0 360 Z" fill="#dceaff"/>
  <g filter="url(#shadow)">
    <rect x="70" y="62" width="460" height="236" rx="24" fill="#ffffff"/>
    <rect x="98" y="92" width="70" height="48" rx="14" fill="#0f172a"/>
    <rect x="168" y="105" width="42" height="22" rx="6" fill="#2f7df6"/>
    <path d="M111 116 h35 m-17 -17 v34" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text x="100" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#102033">ClawHermes-USB</text>
    <text x="102" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#53657a">Windows-first portable runtime suite</text>
    <text x="102" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7b8e">Launcher, adapters, data, logs, backups, WSL payloads</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="618" y="72" width="170" height="92" rx="20" fill="#ffffff"/>
    <circle cx="660" cy="118" r="22" fill="#fee2e2"/>
    <path d="M650 121 c6 -18 24 -18 30 0 M656 127 h18" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <text x="696" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">OpenClaw</text>
    <text x="696" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">Chat control</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="204" width="190" height="92" rx="20" fill="#ffffff"/>
    <circle cx="920" cy="250" r="22" fill="#dbeafe"/>
    <path d="M910 256 h20 m-10 -20 v40 m-18 -20 h36" stroke="#2f7df6" stroke-width="5" stroke-linecap="round"/>
    <text x="956" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Hermes Agent</text>
    <text x="956" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">API backend</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="204" width="220" height="92" rx="20" fill="#ffffff"/>
    <circle cx="652" cy="250" r="22" fill="#dcfce7"/>
    <rect x="639" y="238" width="26" height="22" rx="4" fill="none" stroke="#16a34a" stroke-width="4"/>
    <path d="M639 246 h26" stroke="#16a34a" stroke-width="4"/>
    <text x="688" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Hermes Web UI</text>
    <text x="688" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">Browser workspace</text>
  </g>
