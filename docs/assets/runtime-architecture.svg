<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">ClawHermes runtime architecture</title>
  <desc id="desc">Architecture diagram linking Windows GUI, Node orchestration, adapters, WSL services, browser interfaces, and portable data.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102033" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#6b7b8e"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="26" fill="#f6f9fc"/>
  <text x="54" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#102033">Runtime Architecture</text>
  <text x="54" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#617086">Thin Windows entry, reusable core, replaceable adapters, portable data.</text>
  <g filter="url(#shadow)">
    <rect x="54" y="130" width="220" height="92" rx="18" fill="#ffffff"/>
    <rect x="78" y="154" width="42" height="42" rx="10" fill="#dbeafe"/>
    <path d="M88 166 h22 v18 H88 z M88 175 h22" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="136" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Windows GUI</text>
    <text x="136" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">VBS + WinForms control</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="130" width="230" height="92" rx="18" fill="#ffffff"/>
    <rect x="354" y="154" width="42" height="42" rx="10" fill="#dcfce7"/>
    <path d="M366 182 c10 8 24 0 22 -13 c-2 -13 -21 -16 -28 -4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <text x="412" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Node Core</text>
    <text x="412" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">Lifecycle, ports, logs, backup</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="618" y="130" width="430" height="92" rx="18" fill="#ffffff"/>
    <text x="644" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Adapters</text>
    <text x="644" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">OpenClaw, Hermes Agent, Hermes Web UI descriptors</text>
    <rect x="900" y="153" width="40" height="40" rx="12" fill="#ffedd5"/>
    <path d="M913 165 h14 m-14 10 h20 m-20 10 h12" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="312" width="250" height="116" rx="18" fill="#ffffff"/>
    <text x="116" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">WSL Runtime</text>
    <text x="116" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">ClawHermes-Ubuntu</text>
    <text x="116" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">OpenClaw + Hermes services</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="425" y="312" width="250" height="116" rx="18" fill="#ffffff"/>
    <text x="451" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Browser Interfaces</text>
    <text x="451" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">OpenClaw Chat</text>
    <text x="451" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">Hermes Web UI + Portal</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="312" width="250" height="116" rx="18" fill="#ffffff"/>
    <text x="786" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#182434">Portable Data</text>
    <text x="786" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">data/logs, data/tmp</text>
    <text x="786" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7b8e">settings, cache, backups</text>
  </g>
  <path d="M274 176 H330" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 176 H618" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M732 222 C680 264 604 286 548 312" fill="none" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M748 222 C610 256 342 262 224 312" fill="none" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 222 C842 252 872 278 884 312" fill="none" stroke="#6b7b8e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 370 H425" stroke="#a8b5c7" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <path d="M675 370 H760" stroke="#a8b5c7" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
</svg>
